# nginx.conf — serves the Vue.js production build
# All routes fall back to index.html for Vue Router history mode

server {
    listen       80;
    root         /usr/share/nginx/html;
    index        index.html;

    # Cache static assets aggressively (hashed filenames from Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # All other routes → index.html (Vue Router handles client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
